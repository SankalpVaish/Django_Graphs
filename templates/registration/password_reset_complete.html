{% extends "master.html" %}

{% block title %}Password updated{% endblock %}
{% block main_class %}app-main--narrow{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__head">
    <div class="auth-status__icon auth-status__icon--success"><i class="bi bi-check2-circle"></i></div>
    <h1>Password updated</h1>
    <p>Your new password is set. You can sign in with it now.</p>
  </div>

  <a class="btn btn-primary btn-block" href="{% url 'login' %}">
    <i class="bi bi-box-arrow-in-right"></i> Sign in
  </a>
</div>
{% endblock %}
